="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><rect x="104" y="398" width="8" height="82" rx="0" fill="#FFB000" /><rect x="624" y="412" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="624" y="424" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="624" y="436" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="624" y="448" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="624" y="460" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><text x="132" y="434" font-size="30" class="a b" text-anchor="start" >L2</text><text x="208" y="434" font-size="24" class="g b" text-anchor="start" letter-spacing="2">LINK</text><text x="208" y="462" font-size="17" class="w" text-anchor="start" >Ethernet · MAC · Wi-Fi</text><text x="574" y="464" font-size="14" class="m" text-anchor="end" letter-spacing="2">frame</text><circle cx="664" cy="439" r="4" fill="#00FF41"/><line x1="668" y1="439" x2="700" y2="439" stroke="#0d4d22" stroke-width="2" /><rect x="122" y="494" width="560" height="82" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><rect x="122" y="494" width="8" height="82" rx="0" fill="#00B85A" /><rect x="642" y="508" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="642" y="520" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="642" y="532" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="642" y="544" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="642" y="556" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><text x="150" y="530" font-size="30" class="a b" text-anchor="start" >L1</text><text x="226" y="530" font-size="24" class="g b" text-anchor="start" letter-spacing="2">PHYSICAL</text><text x="226" y="558" font-size="17" class="w" text-anchor="start" >cable · fibre · radio</text><text x="592" y="560" font-size="14" class="m" text-anchor="end" letter-spacing="2">bits</text><circle cx="682" cy="535" r="4" fill="#00FF41"/><line x1="686" y1="535" x2="700" y2="535" stroke="#0d4d22" stroke-width="2" /><text x="730" y="134" font-size="19" class="a" text-anchor="start" letter-spacing="2">ETHERNET II FRAME  (bytes on the wire)</text><rect x="730" y="166" width="109.44827586206897" height="64" rx="0" fill="#0a110b" stroke="#FFB000" stroke-width="2" /><text x="784.7241379310345" y="206" font-size="20" class="a" text-anchor="middle" >ETH</text><rect x="843.448275862069" y="166" width="158.0689655172414" height="64" rx="0" fill="#0a110b" stroke="#00FF41" stroke-width="2" /><text x="922.4827586206897" y="206" font-size="20" class="g" text-anchor="middle" >IPv4</text><rect x="1005.5172413793103" y="166" width="158.0689655172414" height="64" rx="0" fill="#0a110b" stroke="#00B85A" stroke-width="2" /><text x="1084.5517241379312" y="206" font-size="20" class="g" text-anchor="middle" >TCP</text><rect x="1167.5862068965516" y="166" width="146" height="64" rx="0" fill="#0a110b" stroke="1400" stroke-width="2" /><text x="1240.5862068965516" y="206" font-size="20" class="w" text-anchor="middle" >DATA</text><rect x="1317.5862068965516" y="166" width="42" height="64" rx="0" fill="#0a110b" stroke="#708C75" stroke-width="2" /><text x="1338.5862068965516" y="206" font-size="15" class="w" text-anchor="middle" >FCS</text><text x="730" y="272" font-size="18" class="a b" text-anchor="start" >14 B</text><text x="800" y="272" font-size="16" class="w" text-anchor="start" >Ethernet header: EtherType 0x0800 = IPv4</text><text x="730" y="302" font-size="18" class="a b" text-anchor="start" >20 B</text><text x="800" y="302" font-size="16" class="w" text-anchor="start" >IPv4 header: version 4, IHL 5, TTL 64, protocol 6 = TCP</text><text x="730" y="332" font-size="18" class="a b" text-anchor="start" >20 B</text><text x="800" y="332" font-size="16" class="w" text-anchor="start" >TCP header: ports, seq/ack, flags (SYN · ACK)</text><text x="730" y="362" font-size="18" class="a b" text-anchor="start" >4 B</text><text x="800" y="362" font-size="16" class="w" text-anchor="start" >FCS: frame check sequence (CRC-32)</text><line x1="730" y1="404" x2="1350" y2="404" stroke="#0d4d22" stroke-width="2" /><text x="730" y="436" font-size="19" class="a" text-anchor="start" letter-spacing="2">IPv4 header, hex  (checksum computed)</text><rect x="730" y="466" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="788" y="496" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">4500</text><text x="788" y="514" font-size="11" class="m" text-anchor="middle" >ver/IHL/TOS</text><rect x="854" y="466" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="912" y="496" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">003C</text><text x="912" y="514" font-size="11" class="m" text-anchor="middle" >total len</text><rect x="978" y="466" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="1036" y="496" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">1C46</text><text x="1036" y="514" font-size="11" class="m" text-anchor="middle" >ident</text><rect x="1102" y="466" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="1160" y="496" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">4000</text><text x="1160" y="514" font-size="11" class="m" text-anchor="middle" >flags/frag</text><rect x="1226" y="466" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="1284" y="496" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">4006</text><text x="1284" y="514" font-size="11" class="m" text-anchor="middle" >TTL/proto</text><rect x="730" y="552" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="788" y="582" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">201B</text><text x="788" y="600" font-size="11" class="m" text-anchor="middle" >checksum</text><rect x="854" y="552" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="912" y="582" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">C000</text><text x="912" y="600" font-size="11" class="m" text-anchor="middle" >src (hi)</text><rect x="978" y="552" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="1036" y="582" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">020A</text><text x="1036" y="600" font-size="11" class="m" text-anchor="middle" >src (lo)</text><rect x="1102" y="552" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="1160" y="582" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">CB00</text><text x="1160" y="600" font-size="11" class="m" text-anchor="middle" >dst (hi)</text><rect x="1226" y="552" width="116" height="54" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="1284" y="582" font-size="24" class="g b" text-anchor="middle" filter="url(#glowS)">7150</text><text x="1284" y="600" font-size="11" class="m" text-anchor="middle" >dst (lo)</text><text x="730" y="636" font-size="15" class="m" text-anchor="start" >45 → version 4, header 5×4 bytes · 40 06 → TTL 64, protocol 6 (TCP)</text><rect width="1400" height="670" fill="url(#sl)" pointer-events="none"/><rect width="1400" height="670" fill="url(#vg)" pointer-events="none"/></svg>
