<rect width="1400" height="670" fill="#050805"/><rect width="1400" height="640" fill="url(#grid)"/><text x="50" y="58" font-size="30" class="a b" text-anchor="start" letter-spacing="3">B.2 // TCP/IP STACK</text><text x="1350" y="58" font-size="20" class="m" text-anchor="end" letter-spacing="2">ENCAPSULATION  ·  ONE HTTPS REQUEST</text><line x1="50" y1="80" x2="1350" y2="80" stroke="#0d4d22" stroke-width="2" /><rect x="50" y="110" width="560" height="82" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><rect x="50" y="110" width="8" height="82" rx="0" fill="#00B85A" /><rect x="570" y="124" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="570" y="136" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="570" y="148" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="570" y="160" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="570" y="172" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><text x="78" y="146" font-size="30" class="a b" text-anchor="start" >L7</text><text x="154" y="146" font-size="24" class="g b" text-anchor="start" letter-spacing="2">APPLICATION</text><text x="154" y="174" font-size="17" class="w" text-anchor="start" >HTTP · DNS · TLS · DHCP</text><text x="520" y="176" font-size="14" class="m" text-anchor="end" letter-spacing="2">data</text><circle cx="610" cy="151" r="4" fill="#00FF41"/><line x1="614" y1="151" x2="700" y2="151" stroke="#0d4d22" stroke-width="2" /><rect x="68" y="206" width="560" height="82" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><rect x="68" y="206" width="8" height="82" rx="0" fill="#FFB000" /><rect x="588" y="220" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="588" y="232" width="26" height="6" rx="0" fill="#0b120c" stroke="#2d4a33" stroke-width="1" /><rect x="588" y="244" width="2