<svg xmlns="http://www.w3.org/2000/svg" width="760" height="28" viewBox="0 0 760 28" role="img" aria-label="Section divider">
<title>Section divider</title>
<style>
text{font-family:"IBM Plex Mono","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;white-space:pre}
.ln{stroke:#00B85A;stroke-width:1;stroke-dasharray:2 6;animation:f 1.6s linear infinite}
@keyframes f{to{stroke-dashoffset:-8}}
@media (prefers-reduced-motion:reduce){.ln{animation:none}}
</style>
<rect width="760" height="28" fill="#050805"/>
<line class="ln" x1="10" y1="14" x2="300" y2="14"/>
<line class="ln" x1="460" y1="14" x2="750" y2="14"/>
<text x="380" y="18" text-anchor="middle" font-size="12" fill="#FFB000">░▒▓ 0x7F ▓▒░</text>
<text x="310" y="18" text-anchor="end" font-size="10" fill="#708C75">0x00</text>
<text x="450" y="18" font-size="10" fill="#708C75">0xFF</text>
</svg>
