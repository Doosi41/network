<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-label="Laboratory terminal with five example commands: ping, traceroute, dig, curl and tcpdump, syntax highlighted, each with a note on what it shows. Output is not shown."><title>Laboratory terminal with five example commands: ping, traceroute, dig, curl and tcpdump, syntax highlighted, each with a note on what it shows. Output is not shown.</title><style>
text{font-family:"IBM Plex Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace;white-space:pre}
.ser{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman","DejaVu Serif",serif}
.t{fill:#D5D1C6}.a{fill:#CE9954}.s{fill:#7196A9}.m{fill:#858890}.d{fill:#454C58}.gr{fill:#799181}
.b{font-weight:700}.i{font-style:italic}
</style><defs>
<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#D5D1C6" opacity=".035"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r=".75" fill="#D5D1C6" opacity=".055"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#7E3F45"/><rect x="8" width="8" height="16" fill="#12141a"/></pattern>
<radialGradient id="vg" cx="50%" cy="50%" r="80%"><stop offset="65%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
<radialGradient id="scr" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#241b0d"/><stop offset=".55" stop-color="#120e07"/><stop offset="1" stop-color="#08090b"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b35"/><stop offset=".5" stop-color="#171b23"/><stop offset="1" stop-color="#0f1218"/></linearGradient>
</defs>
<rect width="1400" height="810" fill="#0B0D11"/><rect width="1400" height="810" fill="url(#dots)"/><text x="50" y="66" font-size="17" class="a" text-anchor="start" letter-spacing="5">D /</text><text x="50" y="122" font-size="54" class="t ser b" text-anchor="start" letter-spacing="-1">Laboratory</text><text x="1350" y="66" font-size="15" class="m" text-anchor="end" letter-spacing="3"></text><line x1="50" y1="144" x2="1350" y2="144" stroke="#2A303B" stroke-width="1.5" /><rect x="50" y="142" width="120" height="4" rx="0" fill="#CE9954" /><rect x="1010" y="40" width="340" height="34" rx="0" fill="#7E3F45" /><text x="1180" y="63" font-size="13" class="t b" text-anchor="middle" letter-spacing="1">EXAMPLES ONLY · OUTPUT NOT SHOWN</text><rect x="1010" y="76" width="340" height="6" rx="0" fill="url(#haz)" /><rect x="50" y="180" width="860" height="560" rx="0" fill="#0e1014" stroke="#2A303B" stroke-width="1.5" /><rect x="50" y="180" width="860" height="34" rx="0" fill="#171B23" stroke="#2A303B" stroke-width="1.5" /><circle cx="74" cy="197" r="5" fill="#454C58"/><circle cx="94" cy="197" r="5" fill="#454C58"/><circle cx="114" cy="197" r="5" fill="#454C58"/><text x="480" y="202" font-size="14" class="m" text-anchor="middle" >lab@blacksite:~/labs</text><text x="84" y="276" font-size="16" class="m" text-anchor="start" ># 1 · reachability (ICMP echo)</text><text x="84" y="308" font-size="22" class="t"><tspan class="a">$ </tspan><tspan class="t b">ping</tspan><tspan class="s"> -c 4 </tspan><tspan class="t">192.0.2.1</tspan></text><text x="84" y="362" font-size="16" class="m" text-anchor="start" ># 2 · the path of a packet (TTL)</text><text x="84" y="394" font-size="22" class="t"><tspan class="a">$ </tspan><tspan class="t b">traceroute</tspan><tspan class="s"> -n </tspan><tspan class="t">203.0.113.80</tspan></text><text x="84" y="448" font-size="16" class="m" text-anchor="start" ># 3 · name resolution (DNS)</text><text x="84" y="480" font-size="22" class="t"><tspan class="a">$ </tspan><tspan class="t b">dig</tspan><tspan class="t"> example.com A </tspan><tspan class="s">+short</tspan></text><text x="84" y="534" font-size="16" class="m" text-anchor="start" ># 4 · the full HTTP / TLS conversation</text><text x="84" y="566" font-size="22" class="t"><tspan class="a">$ </tspan><tspan class="t b">curl</tspan><tspan class="s"> -v </tspan><tspan class="a">https://example.com</tspan></text><text x="84" y="620" font-size="16" class="m" text-anchor="start" ># 5 · listen on the wire</text><text x="84" y="652" font-size="22" class="t"><tspan class="a">$ </tspan><tspan class="m">sudo </tspan><tspan class="t b">tcpdump</tspan><tspan class="s"> -i en0 -nn </tspan><tspan class="a">'tcp port 443'</tspan></text><text x="84" y="712" font-size="22" class="a">$ </text><rect x="110" y="694" width="12" height="22" fill="#CE9954"/><text x="960" y="204" font-size="26" class="t ser i b" text-anchor="start" >What you see</text><line x1="960" y1="218" x2="1350" y2="218" stroke="#CE9954" stroke-width="2" /><text x="960" y="260" font-size="28" class="t ser b" text-anchor="start" >ping</text><text x="1350" y="260" font-size="14" class="a" text-anchor="end" letter-spacing="1">ICMP · L3</text><text x="960" y="288" font-size="16" class="s" text-anchor="start" >RTT, потери пакетов</text><line x1="960" y1="306" x2="1350" y2="306" stroke="#2A303B" stroke-width="1" /><text x="960" y="360" font-size="28" class="t ser b" text-anchor="start" >traceroute</text><text x="1350" y="360" font-size="14" class="a" text-anchor="end" letter-spacing="1">TTL · L3</text><text x="960" y="388" font-size="16" class="s" text-anchor="start" >маршрутизаторы по пути</text><line x1="960" y1="406" x2="1350" y2="406" stroke="#2A303B" stroke-width="1" /><text x="960" y="460" font-size="28" class="t ser b" text-anchor="start" >dig</text><text x="1350" y="460" font-size="14" class="a" text-anchor="end" letter-spacing="1">UDP/TCP 53 · L7</text><text x="960" y="488" font-size="16" class="s" text-anchor="start" >ответ DNS-сервера</text><line x1="960" y1="506" x2="1350" y2="506" stroke="#2A303B" stroke-width="1" /><text x="960" y="560" font-size="28" class="t ser b" text-anchor="start" >curl -v</text><text x="1350" y="560" font-size="14" class="a" text-anchor="end" letter-spacing="1">TCP 443 · L7</text><text x="960" y="588" font-size="16" class="s" text-anchor="start" >TLS-рукопожатие, HTTP</text><line x1="960" y1="606" x2="1350" y2="606" stroke="#2A303B" stroke-width="1" /><text x="960" y="660" font-size="28" class="t ser b" text-anchor="start" >tcpdump</text><text x="1350" y="660" font-size="14" class="a" text-anchor="end" letter-spacing="1">L2–L4</text><text x="960" y="688" font-size="16" class="s" text-anchor="start" >сырые кадры и пакеты</text><line x1="960" y1="706" x2="1350" y2="706" stroke="#2A303B" stroke-width="1" /><text x="50" y="784" font-size="14" class="m" text-anchor="start" >Адреса — зарезервированные для документации (RFC 5737). Команды — шаблоны для практики, не журнал выполненного.</text><rect width="1400" height="810" fill="url(#sl)" pointer-events="none"/><rect width="1400" height="810" fill="url(#vg)" pointer-events="none"/></svg>
