<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Laboratory terminal with five example commands: ping, traceroute, dig, curl and tcpdump, syntax highlighted, each with a note on what it shows. Output is not shown."><title>Laboratory terminal with five example commands: ping, traceroute, dig, curl and tcpdump, syntax highlighted, each with a note on what it shows. Output is not shown.</title><style>
text{font-family:"IBM Plex Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace;white-space:pre}
.g{fill:#00FF41}.s{fill:#00B85A}.a{fill:#FFB000}.m{fill:#708C75}.w{fill:#C8E6CC}.d{fill:#0d4d22}.r{fill:#FF4545}
.b{font-weight:700}
</style><defs>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00FF41" opacity=".055"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00FF41" stroke-opacity=".045"/></pattern>
<radialGradient id="vg" cx="50%" cy="50%" r="78%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".6"/></radialGradient>
<radialGradient id="scr" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#0b3a1a"/><stop offset=".6" stop-color="#04180c"/><stop offset="1" stop-color="#010a05"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26322a"/><stop offset=".5" stop-color="#141c16"/><stop offset="1" stop-color="#0b100c"/></linearGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00FF41" stop-opacity=".22"/><stop offset="1" stop-color="#00FF41" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1400" height="700" fill="#050805"/><rect width="1400" height="700" fill="url(#grid)"/><text x="50" y="58" font-size="30" class="a b" text-anchor="start" letter-spacing="3">D // LABORATORY</text><text x="1350" y="58" font-size="20" class="m" text-anchor="end" letter-spacing="2">EXAMPLE COMMANDS  ·  OUTPUT NOT SHOWN</text><line x1="50" y1="80" x2="1350" y2="80" stroke="#0d4d22" stroke-width="2" /><rect x="50" y="104" width="860" height="560" rx="10" fill="#030803" stroke="#00B85A" stroke-width="2" /><path d="M50 114a10 10 0 0 1 10-10h840a10 10 0 0 1 10 10v30H50z" fill="#0a130b"/><circle cx="78" cy="124" r="6" fill="#FF4545" opacity=".85"/><circle cx="100" cy="124" r="6" fill="#FFB000" opacity=".85"/><circle cx="122" cy="124" r="6" fill="#00B85A" opacity=".85"/><text x="480" y="129" font-size="15" class="m" text-anchor="middle" >lab@blacksite:~/labs</text><text x="84" y="178" font-size="17" class="m" text-anchor="start" ># 1 · reachability (ICMP echo)</text><text x="84" y="212" font-size="23" class="w"><tspan class="s">$ </tspan><tspan class="a b">ping</tspan><tspan class="s"> -c 4 </tspan><tspan class="w">192.0.2.1</tspan></text><text x="84" y="270" font-size="17" class="m" text-anchor="start" ># 2 · the path of a packet (TTL tricks)</text><text x="84" y="304" font-size="23" class="w"><tspan class="s">$ </tspan><tspan class="a b">traceroute</tspan><tspan class="s"> -n </tspan><tspan class="w">203.0.113.80</tspan></text><text x="84" y="362" font-size="17" class="m" text-anchor="start" ># 3 · name resolution (DNS)</text><text x="84" y="396" font-size="23" class="w"><tspan class="s">$ </tspan><tspan class="a b">dig</tspan><tspan class="w"> example.com A </tspan><tspan class="s">+short</tspan></text><text x="84" y="454" font-size="17" class="m" text-anchor="start" ># 4 · the full HTTP / TLS conversation</text><text x="84" y="488" font-size="23" class="w"><tspan class="s">$ </tspan><tspan class="a b">curl</tspan><tspan class="s"> -v </tspan><tspan class="g">https://example.com</tspan></text><text x="84" y="546" font-size="17" class="m" text-anchor="start" ># 5 · listen on the wire</text><text x="84" y="580" font-size="23" class="w"><tspan class="s">$ </tspan><tspan class="m">sudo </tspan><tspan class="a b">tcpdump</tspan><tspan class="s"> -i en0 -nn </tspan><tspan class="g">'tcp port 443'</tspan></text><text x="84" y="646" font-size="23" class="s">$ </text><rect x="112" y="626" width="13" height="24" fill="#00FF41"/><text x="950" y="120" font-size="18" class="a" text-anchor="start" letter-spacing="3">WHAT YOU SEE</text><line x1="950" y1="134" x2="1350" y2="134" stroke="#0d4d22" stroke-width="2" /><rect x="950" y="148" width="400" height="78" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="968" y="180" font-size="22" class="g b" text-anchor="start" >ping</text><text x="968" y="208" font-size="16" class="w" text-anchor="start" >RTT, потери пакетов</text><text x="1332" y="180" font-size="15" class="a" text-anchor="end" >ICMP · L3</text><rect x="950" y="248" width="400" height="78" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="968" y="280" font-size="22" class="g b" text-anchor="start" >traceroute</text><text x="968" y="308" font-size="16" class="w" text-anchor="start" >маршрутизаторы по пути</text><text x="1332" y="280" font-size="15" class="a" text-anchor="end" >TTL · L3</text><rect x="950" y="348" width="400" height="78" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="968" y="380" font-size="22" class="g b" text-anchor="start" >dig</text><text x="968" y="408" font-size="16" class="w" text-anchor="start" >ответ DNS-сервера</text><text x="1332" y="380" font-size="15" class="a" text-anchor="end" >UDP/TCP 53 · L7</text><rect x="950" y="448" width="400" height="78" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="968" y="480" font-size="22" class="g b" text-anchor="start" >curl -v</text><text x="968" y="508" font-size="16" class="w" text-anchor="start" >TLS-рукопожатие, HTTP</text><text x="1332" y="480" font-size="15" class="a" text-anchor="end" >TCP 443 · L7</text><rect x="950" y="548" width="400" height="78" rx="0" fill="#0a110b" stroke="#17331d" stroke-width="2" /><text x="968" y="580" font-size="22" class="g b" text-anchor="start" >tcpdump</text><text x="968" y="608" font-size="16" class="w" text-anchor="start" >сырые кадры и пакеты</text><text x="1332" y="580" font-size="15" class="a" text-anchor="end" >L2–L4</text><text x="50" y="692" font-size="15" class="m" text-anchor="start" >Адреса — зарезервированные для документации (RFC 5737). Команды — шаблоны для практики, не журнал выполненного.</text><rect width="1400" height="700" fill="url(#sl)" pointer-events="none"/><rect width="1400" height="700" fill="url(#vg)" pointer-events="none"/></svg>
