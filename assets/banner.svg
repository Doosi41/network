<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="NETWORK — learning log: from wire to packet">
  <style>
    text { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    .dim { fill: #6e7681; font-size: 15px; }
    .grn { fill: #3fb950; font-size: 15px; }
    .amb { fill: #d29922; font-size: 15px; }
    .cyn { fill: #58a6ff; font-size: 15px; }
    .title { fill: #3fb950; font-size: 76px; font-weight: 700; letter-spacing: 10px; }
    .sub { fill: #c9d1d9; font-size: 18px; letter-spacing: 3px; }
    .cursor { fill: #3fb950; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { fill: #ffffff; opacity: .025; }
  </style>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="400" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="859" height="399" rx="12" fill="none" stroke="#30363d"/>

  <!-- window bar -->
  <path d="M0 12a12 12 0 0 1 12-12h836a12 12 0 0 1 12 12v24H0z" fill="#161b22"/>
  <circle cx="26" cy="18" r="6" fill="#f85149"/>
  <circle cx="48" cy="18" r="6" fill="#d29922"/>
  <circle cx="70" cy="18" r="6" fill="#3fb950"/>
  <text x="430" y="23" text-anchor="middle" class="dim">root@network: ~/learn</text>

  <!-- boot log -->
  <text x="28" y="68"  class="dim">$ <tspan class="grn">./boot --stack tcp/ip</tspan></text>
  <text x="28" y="90"  class="dim">[<tspan class="grn"> OK </tspan>] link ...... ethernet, mac, vlan</text>
  <text x="28" y="112" class="dim">[<tspan class="grn"> OK </tspan>] net ....... ip, subnets, routing</text>
  <text x="28" y="134" class="dim">[<tspan class="grn"> OK </tspan>] transport .. tcp, udp, ports</text>
  <text x="28" y="156" class="dim">[<tspan class="amb">WAIT</tspan>] app ........ dns, http, tls</text>

  <!-- title -->
  <text x="430" y="262" text-anchor="middle" class="title" filter="url(#glow)">NETWORK</text>
  <text x="430" y="298" text-anchor="middle" class="sub">FROM WIRE TO PACKET</text>

  <!-- prompt -->
  <text x="28" y="368" class="dim">$ <tspan class="cyn">cat</tspan> readme.md</text>
  <rect class="cursor" x="172" y="354" width="10" height="18"/>

  <!-- scanlines -->
  <g>
    <rect class="scan" x="0" y="40"  width="860" height="2"/>
    <rect class="scan" x="0" y="100" width="860" height="2"/>
    <rect class="scan" x="0" y="160" width="860" height="2"/>
    <rect class="scan" x="0" y="220" width="860" height="2"/>
    <rect class="scan" x="0" y="280" width="860" height="2"/>
    <rect class="scan" x="0" y="340" width="860" height="2"/>
  </g>
</svg>
