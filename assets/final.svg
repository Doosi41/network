<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-label="Connection terminated. End of transmission."><title>Connection terminated. End of transmission.</title><style>
text{font-family:"IBM Plex Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace;white-space:pre}
.ser{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman","DejaVu Serif",serif}
.t{fill:#D5D1C6}.a{fill:#CE9954}.s{fill:#7196A9}.m{fill:#858890}.d{fill:#454C58}.gr{fill:#799181}
.b{font-weight:700}.i{font-style:italic}
</style><defs>
<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#D5D1C6" opacity=".035"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r=".75" fill="#D5D1C6" opacity=".055"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#7E3F45"/><rect x="8" width="8" height="16" fill="#12141a"/></pattern>
<radialGradient id="vg" cx="50%" cy="50%" r="80%"><stop offset="65%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
<radialGradient id="scr" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#241b0d"/><stop offset=".55" stop-color="#120e07"/><stop offset="1" stop-color="#08090b"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b35"/><stop offset=".5" stop-color="#171b23"/><stop offset="1" stop-color="#0f1218"/></linearGradient>
</defs>
<rect width="1400" height="440" fill="#0B0D11"/><rect width="1400" height="440" fill="url(#dots)"/><text x="50" y="66" font-size="17" class="a" text-anchor="start" letter-spacing="5">F /</text><text x="50" y="122" font-size="54" class="t ser b" text-anchor="start" letter-spacing="-1">Final Connection</text><text x="1350" y="66" font-size="15" class="m" text-anchor="end" letter-spacing="3">SESSION CLOSED</text><line x1="50" y1="144" x2="1350" y2="144" stroke="#2A303B" stroke-width="1.5" /><rect x="50" y="142" width="120" height="4" rx="0" fill="#CE9954" /><text x="700" y="258" font-size="94" class="t ser b i" text-anchor="middle" textLength="1100" lengthAdjust="spacingAndGlyphs">Connection terminated.</text><text x="700" y="312" font-size="24" class="a" text-anchor="middle" letter-spacing="12">END OF TRANSMISSION</text><line x1="330" y1="360" x2="1070" y2="360" stroke="#D5D1C6" stroke-width="1.5" /><circle cx="700" cy="360" r="4" fill="#D5D1C6"/><text x="700" y="406" font-size="17" class="m" text-anchor="middle" >root@blacksite:~# logout</text><rect width="1400" height="440" fill="url(#sl)" pointer-events="none"/><rect width="1400" height="440" fill="url(#vg)" pointer-events="none"/></svg>
