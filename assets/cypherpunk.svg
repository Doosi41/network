</text><rect x="650" y="170" width="170" height="54" rx="0" fill="#0a110b" stroke="#00B85A" stroke-width="2" /><text x="735.0" y="204" font-size="19" class="g" text-anchor="middle" letter-spacing="1">PLAINTEXT</text><line x1="820" y1="197" x2="895" y2="197" stroke="#00B85A" stroke-width="3" /><g fill="none" stroke="#FFB000" stroke-width="4"><circle cx="906" cy="197" r="13"/><path d="M919 197H958M946 197v13M958 197v10"/></g><text x="932" y="246" font-size="14" class="a" text-anchor="middle" >PUBLIC KEY</text><line x1="968" y1="197" x2="1040" y2="197" stroke="#00B85A" stroke-width="3" /><rect x="1040" y="170" width="170" height="54" rx="0" fill="#0a110b" stroke="#FFB000" stroke-width="2" /><text x="1125.0" y="204" font-size="19" class="a" text-anchor="middle" letter-spacing="1">CIPHERTEXT</text><rect x="650" y="300" width="170" height="54" rx="0" fill="#0a110b" stroke="#FFB000" stroke-width="2" /><text x="735.0" y="334" font-size="19" class="a" text-anchor="middle" letter-spacing="1">CIPHERTEXT</text><line x1="820" y1="327" x2="895" y2="327" stroke="#00B85A" stroke-width="3" /><g fill="none" stroke="#00FF41" stroke-width="4"><circle cx="906" cy="327" r="13"/><path d="M919 327H958M946 327v13M958 327v10"/></g><text x="932" y="376" font-size="14" class="g" text-anchor="middle" >PRIVATE KEY</text><line x1="968" y1="327" x2="1040" y2="327" stroke="#00B85A" stroke-width="3" /><rect x="1040" y="300" width="170" height="54" rx="0" fill="#0a110b" stroke="#00B85A" stroke-width="2" /><text x="1125.0" y="334" font-size="19" class="g" text-anchor="middle" letter-spacing="1">PLAINTEXT</text><text x="650" y="432" font-size="16" class="w" text-anchor="start" >encrypt with the public key — anyone can.</text><text x="650" y="458" font-size="16" class="w" text-anchor="start" >decrypt with the private key — only the owner.</text><line x1="1238" y1="180" x2="1338" y2="170" stroke="#0d4d22" stroke-width="1.5" /><line x1="1238" y1="180" x2="1348" y2="270" stroke="#0d4d22" stroke-width="1.5"